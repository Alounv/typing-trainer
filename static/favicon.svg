<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    A favicon has no inherited colour, so `currentColor` resolves to black and
    disappears against a dark tab strip. The tab strip follows the OS, not the
    app's theme, so the query is on `prefers-color-scheme` rather than
    `data-theme`.
  -->
  <style>
    path { fill: #1f2937; }
    @media (prefers-color-scheme: dark) { path { fill: #e5e7eb; } }
  </style>
